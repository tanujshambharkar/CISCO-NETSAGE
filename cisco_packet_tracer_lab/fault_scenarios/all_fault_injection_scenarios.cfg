! ==============================================================================
! NetSage AI Lab -- Fault Injection & Troubleshooting Scenarios (30 Cases)
! Reference: data/cases.csv
! ==============================================================================

! ==============================================================================
! CATEGORY 1: VLAN MISCONFIGURATIONS (Cases 1-4)
! ==============================================================================
! CASE-001: Access Port Missing VLAN Definition (SW2)
! Fault: Fa0/10 assigned to VLAN 10, but VLAN 10 deleted from switch database.
! Fix: Enter config mode and create "vlan 10; name Finance".

! CASE-002: Trunk Allowed VLAN List Excludes Active Subnet (SW1)
! Fault: "switchport trunk allowed vlan 20,30,99" (VLAN 10 omitted).
! Fix: "switchport trunk allowed vlan add 10".

! CASE-003: Native VLAN Mismatch Across Trunk Link (SW1 vs SW2)
! Fault: SW1 Fa0/1 has "switchport trunk native vlan 99", SW2 Fa0/1 has "switchport trunk native vlan 1".
! Fix: On SW2 Fa0/1, apply "switchport trunk native vlan 99".

! CASE-004: Switchport Mode Misnegotiation / Access Mode on Trunk Link (SW2)
! Fault: SW2 Fa0/1 configured as "switchport mode access" instead of trunk.
! Fix: "switchport mode trunk".

! ==============================================================================
! CATEGORY 2: DEFAULT GATEWAY & SUBNET MISCONFIGURATIONS (Cases 5-8)
! ==============================================================================
! CASE-005: Host Configured with Wrong Subnet Mask (PC-1)
! Fault: PC-1 IP set to 192.168.10.50 / 255.255.255.128 while router is /24.
! Fix: Change PC-1 mask to 255.255.255.0.

! CASE-006: Host Missing Default Gateway Configuration (PC-2)
! Fault: Default gateway left blank (0.0.0.0).
! Fix: Set default gateway to 192.168.20.1.

! CASE-007: Default Gateway Configured in Different Subnet (PC-1)
! Fault: PC-1 IP 172.16.10.5 / 255.255.0.0, Default Gateway set to 10.0.0.1.
! Fix: Change Default Gateway to 172.16.0.1.

! CASE-008: Switch SVI Missing Default Gateway (SW2)
! Fault: SW2 SVI is 192.168.99.20, but "no ip default-gateway" configured.
! Fix: Configure "ip default-gateway 192.168.99.1".

! ==============================================================================
! CATEGORY 3: DHCP & RELAY AGENT MISCONFIGURATIONS (Cases 9-12)
! ==============================================================================
! CASE-009: Missing IP Helper-Address on Sub-Interface (R2)
! Fault: Gi0/0/0.10 has no "ip helper-address 192.168.100.1".
! Fix: On interface Gi0/0/0.10, apply "ip helper-address 192.168.100.1".

! CASE-010: DHCP Pool Network Subnet Mismatch (R1)
! Fault: Pool POOL-VLAN10 configured with "network 192.168.15.0 255.255.255.0".
! Fix: Change to "network 192.168.10.0 255.255.255.0".

! CASE-011: Router Interface IP Not Excluded from DHCP Pool (R1)
! Fault: Missing "ip dhcp excluded-address 192.168.10.1".
! Fix: Add "ip dhcp excluded-address 192.168.10.1 192.168.10.10".

! CASE-012: DHCP Pool Wrong Default-Router IP (R1)
! Fault: Pool configured with "default-router 192.168.10.254" (non-existent).
! Fix: Change to "default-router 192.168.10.1".

! ==============================================================================
! CATEGORY 4: DNS CONFIGURATION ISSUES (Cases 13-15)
! ==============================================================================
! CASE-013: Host Pointing to Incorrect DNS Server IP (PC-1)
! Fault: PC-1 DNS server configured as 8.8.4.4 instead of 192.168.10.50.
! Fix: Set DNS server to 192.168.10.50.

! CASE-014: DNS Server Interface Administratively Down (DNS-SRV)
! Fault: DNS Server switchport shut down.
! Fix: "no shutdown" on connected switchport.

! CASE-015: DNS Domain-Name Lookup Disabled / Missing Static Mapping (R1)
! Fault: "no ip domain lookup" enabled on router.
! Fix: Enable "ip domain lookup" and specify "ip name-server 192.168.10.50".

! ==============================================================================
! CATEGORY 5: IP ROUTING PROTOCOL FAULTS (Cases 16-20)
! ==============================================================================
! CASE-016: Missing Static Default Route to Next-Hop (R1)
! Fault: R1 missing "ip route 0.0.0.0 0.0.0.0 203.0.113.1".
! Fix: Add "ip route 0.0.0.0 0.0.0.0 203.0.113.1".

! CASE-017: OSPF Area ID Mismatch on Point-to-Point Link (R1 vs R2)
! Fault: R1 Gi0/0/1 in Area 0, R2 Gi0/0/1 in Area 1.
! Fix: Change R2 network command to "area 0".

! CASE-018: OSPF Passive Interface Applied to Link Connecting Neighbor (R2)
! Fault: R2 has "passive-interface GigabitEthernet0/0/1".
! Fix: "no passive-interface GigabitEthernet0/0/1".

! CASE-019: Missing Network Statement for Subnet in OSPF (R2)
! Fault: VLAN 30 (192.168.30.0/24) omitted from "router ospf 1".
! Fix: Add "network 192.168.30.0 0.0.0.255 area 0".

! CASE-020: EIGRP Autonomous System Number Mismatch (R1 vs R2)
! Fault: R1 in AS 100, R2 in AS 200.
! Fix: Reconfigure both routers under "router eigrp 100".

! ==============================================================================
! CATEGORY 6: ACCESS CONTROL LIST (ACL) FILTERING ERRORS (Cases 21-24)
! ==============================================================================
! CASE-021: ACL Applied in Wrong Direction on Interface (R1)
! Fault: "ip access-group 101 out" applied on inbound interface Gi0/0/1.
! Fix: Change to "ip access-group 101 in".

! CASE-022: ACL Missing Permit Statement (Empty ACL / Implicit Deny All)
! Fault: ACL has deny statements without "permit any" or valid permits.
! Fix: Add explicit permits for required business traffic.

! CASE-023: Inverted Wildcard Mask in Extended ACL (R1)
! Fault: "permit tcp 192.168.10.0 255.255.255.0 any eq 80" (subnet mask used instead of wildcard).
! Fix: "permit tcp 192.168.10.0 0.0.0.255 any eq 80".

! CASE-024: ACL Blocking ICMP Echo Reply / Return Traffic
! Fault: ACL permits outbound HTTP/HTTPS but drops ICMP return replies.
! Fix: Add "permit icmp any any echo-reply" or "permit tcp any any established".

! ==============================================================================
! CATEGORY 7: NAT / PAT ADDRESS TRANSLATION ERRORS (Cases 25-27)
! ==============================================================================
! CASE-025: Missing "ip nat inside" / "ip nat outside" Interface Statements (R1)
! Fault: Gi0/0/0 missing "ip nat outside".
! Fix: On Gi0/0/0, apply "ip nat outside".

! CASE-026: Missing "overload" Keyword on PAT Translation Rule (R1)
! Fault: "ip nat inside source list 1 interface Gi0/0/0" (static 1:1 NAT mapping single host).
! Fix: "ip nat inside source list 1 interface Gi0/0/0 overload".

! CASE-027: NAT Source ACL Does Not Match Local LAN Subnets (R1)
! Fault: NAT ACL permits 10.0.0.0/8 but local LAN is 192.168.0.0/16.
! Fix: Update NAT ACL to "permit 192.168.0.0 0.0.255.255".

! ==============================================================================
! CATEGORY 8: WIRELESS LAN (WLAN) & CONTROLLER FAULTS (Cases 28-30)
! ==============================================================================
! CASE-028: WPA2-PSK Passphrase Mismatch Between Client and WLC
! Fault: Client configured with wrong pre-shared key.
! Fix: Update client profile with correct passphrase.

! CASE-029: Co-Channel Radio Frequency Interference / Channel Overlap
! Fault: Adjacent APs both transmitting on 2.4GHz Channel 2 and 3 (overlapping non-standard).
! Fix: Reassign APs to orthogonal channels (1, 6, 11).

! CASE-030: Lightweight AP Unable to Discover / Join WLC (DHCP Option 43 Missing)
! Fault: AP DHCP pool missing Option 43 (WLC Management IP 192.168.99.50).
! Fix: Add "option 43 ip 192.168.99.50" to AP DHCP pool.
