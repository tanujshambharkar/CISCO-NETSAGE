! =========================================================
! NetSage AI Lab -- R2 Branch / Inter-VLAN Router Baseline Config
! Cisco 2911 / 4321 IOS Software (Router-on-a-Stick)
! =========================================================
version 15.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname R2-Branch
!
interface Loopback0
 ip address 2.2.2.2 255.255.255.255
 description OSPF Router ID
!
interface GigabitEthernet0/0/1
 description Point-to-Point-to-R1
 ip address 192.168.100.2 255.255.255.252
 duplex auto
 speed auto
 no shutdown
!
interface GigabitEthernet0/0/0
 description Trunk-to-SW1-CoreSwitch
 no ip address
 duplex auto
 speed auto
 no shutdown
!
interface GigabitEthernet0/0/0.10
 description Finance-VLAN10
 encapsulation dot1Q 10
 ip address 192.168.10.1 255.255.255.0
 ip helper-address 192.168.100.1
!
interface GigabitEthernet0/0/0.20
 description Sales-VLAN20
 encapsulation dot1Q 20
 ip address 192.168.20.1 255.255.255.0
 ip helper-address 192.168.100.1
!
interface GigabitEthernet0/0/0.30
 description Engineering-VLAN30
 encapsulation dot1Q 30
 ip address 192.168.30.1 255.255.255.0
!
interface GigabitEthernet0/0/0.99
 description Management-Native-VLAN99
 encapsulation dot1Q 99 native
 ip address 192.168.99.1 255.255.255.0
!
router ospf 1
 router-id 2.2.2.2
 network 2.2.2.2 0.0.0.0 area 0
 network 192.168.100.0 0.0.0.3 area 0
 network 192.168.10.0 0.0.0.255 area 0
 network 192.168.20.0 0.0.0.255 area 0
 network 192.168.30.0 0.0.0.255 area 0
 network 192.168.99.0 0.0.0.255 area 0
!
line con 0
 logging synchronous
line vty 0 4
 login local
 transport input ssh
!
end
