! =========================================================
! NetSage AI Lab -- SW1 Core / Distribution Switch Config
! Cisco Catalyst 2960 / 3560 Switch
! =========================================================
version 15.0
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname SW1-Core
!
vlan 10
 name Finance
!
vlan 20
 name Sales
!
vlan 30
 name Engineering
!
vlan 99
 name Management
!
interface GigabitEthernet0/1
 description Trunk-to-R2-Router
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,30,99
 no shutdown
!
interface FastEthernet0/1
 description Trunk-to-SW2-AccessSwitch1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,30,99
 no shutdown
!
interface FastEthernet0/2
 description Trunk-to-SW3-AccessSwitch2
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,30,99
 no shutdown
!
interface FastEthernet0/24
 description Link-to-WLC2504
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,99
 no shutdown
!
interface Vlan99
 description Management-SVI
 ip address 192.168.99.10 255.255.255.0
 no shutdown
!
ip default-gateway 192.168.99.1
!
line con 0
 logging synchronous
line vty 0 4
 login local
 transport input ssh
!
end
