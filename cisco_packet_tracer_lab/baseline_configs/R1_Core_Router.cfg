! =========================================================
! NetSage AI Lab -- R1 Core / Edge Router Baseline Config
! Cisco 2911 / 4321 IOS Software
! =========================================================
version 15.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname R1-Core
!
ip dhcp excluded-address 192.168.10.1 192.168.10.10
ip dhcp excluded-address 192.168.20.1 192.168.20.10
ip dhcp excluded-address 192.168.30.1 192.168.30.10
!
ip dhcp pool POOL-VLAN10
 network 192.168.10.0 255.255.255.0
 default-router 192.168.10.1
 dns-server 192.168.10.50
!
ip dhcp pool POOL-VLAN20
 network 192.168.20.0 255.255.255.0
 default-router 192.168.20.1
 dns-server 192.168.10.50
!
interface Loopback0
 ip address 1.1.1.1 255.255.255.255
 description OSPF Router ID & Management Loopback
!
interface GigabitEthernet0/0/0
 description WAN-Link-to-ISP
 ip address 203.0.113.2 255.255.255.252
 ip nat outside
 duplex auto
 speed auto
 no shutdown
!
interface GigabitEthernet0/0/1
 description Point-to-Point-to-R2
 ip address 192.168.100.1 255.255.255.252
 ip nat inside
 duplex auto
 speed auto
 no shutdown
!
router ospf 1
 router-id 1.1.1.1
 network 1.1.1.1 0.0.0.0 area 0
 network 192.168.100.0 0.0.0.3 area 0
 default-information originate
!
ip access-list standard NAT-ACL
 permit 192.168.0.0 0.0.255.255
!
ip nat inside source list NAT-ACL interface GigabitEthernet0/0/0 overload
!
ip route 0.0.0.0 0.0.0.0 203.0.113.1
!
line con 0
 logging synchronous
line vty 0 4
 login local
 transport input ssh
!
end
